name: Runner diagnostics.

on:
  workflow_dispatch:

jobs:
  diag:
    name: Runner diagnostics
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Machine and commit limits.
        run: |
          $cs = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          $pf = Get-CimInstance Win32_PageFileUsage
          "CPU logical:      $env:NUMBER_OF_PROCESSORS"
          "CPU physical:     $($cs.NumberOfProcessors)"
          "Total RAM GiB:    $([math]::Round($cs.TotalPhysicalMemory/1GB,2))"
          "Free RAM GiB:     $([math]::Round($os.FreePhysicalMemory/1MB,2))"
          "Commit limit GiB: $([math]::Round($os.TotalVirtualMemorySize/1MB,2))"
          "Commit free GiB:  $([math]::Round($os.FreeVirtualMemory/1MB,2))"
          foreach ($p in $pf) {
            "Pagefile:         $($p.Name) allocated $([math]::Round($p.AllocatedBaseSize/1024,2)) GiB peak $([math]::Round($p.PeakUsage/1024,2)) GiB"
          }
          "Pagefile automatic managed: $($cs.AutomaticManagedPagefile)"
          Get-PSDrive -PSProvider FileSystem | ForEach-Object {
            "Drive $($_.Name) free GiB $([math]::Round($_.Free/1GB,2))"
          }

      - name: Linker binary shape.
        run: |
          function Get-PeInfo($path) {
            $b = [System.IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            $machine = [BitConverter]::ToUInt16($b, $pe + 4)
            $chars = [BitConverter]::ToUInt16($b, $pe + 22)
            $arch = switch ($machine) { 0x014c { 'i386' } 0x8664 { 'x64' } 0xaa64 { 'arm64' } default { "0x$('{0:x}' -f $machine)" } }
            $laa = ($chars -band 0x20) -ne 0
            "$path : $arch, large-address-aware: $laa, size MiB $([math]::Round((Get-Item $path).Length/1MB,2))"
          }
          $vs = 'C:\Program Files\Microsoft Visual Studio\18\Enterprise'
          $ver = (Get-ChildItem "$vs\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).Name
          "MSVC version: $ver"
          Get-PeInfo "$vs\VC\Tools\MSVC\$ver\bin\HostX64\x64\link.exe"
          Get-PeInfo "$vs\VC\Tools\MSVC\$ver\bin\HostX64\x64\cl.exe"
          Get-PeInfo "$vs\VC\Tools\MSVC\$ver\bin\HostX64\x64\lib.exe"
          (Get-Command lld-link.exe -ErrorAction SilentlyContinue) | ForEach-Object { Get-PeInfo $_.Source }
          (Get-Command clang-cl.exe -ErrorAction SilentlyContinue) | ForEach-Object { Get-PeInfo $_.Source }
